[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests (deselect with '-m "not integration"')
    unit: marks unit tests (select with '-m "unit"')
    mobile: marks tests that should run on mobile environment
    training: marks training tests (select with '-m "training"')
    search: marks tests related to search functionality
    e2e: marks end-to-end tests
    model: marks model-specific tests
    asyncio: marks tests as asynchronous

# Test çalıştırırken gerekli başlangıç argumentleri
addopts = --strict-markers -v

# Asyncio mode for async tests
asyncio_mode = auto

# Test bulmada kullanılacak klasörler
norecursedirs = .git .tox venv __pycache__ *.egg-info 