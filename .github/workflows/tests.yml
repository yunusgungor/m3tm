name: M³TM Test Süiti

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9]

    steps:
    - uses: actions/checkout@v3
    - name: Python ${{ matrix.python-version }} kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Bağımlılıkların yüklenmesi
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-mock
    
    - name: Unit testlerinin çalıştırılması
      run: |
        pytest tests/unit -v --cov=m3tm --cov-report=xml
    
    - name: Kapsam raporunu yükle
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-unittest

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - uses: actions/checkout@v3
    - name: Python 3.9 kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'
    
    - name: Bağımlılıkların yüklenmesi
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-mock
    
    - name: Entegrasyon testlerinin çalıştırılması
      run: |
        pytest tests/integration -v --cov=m3tm --cov-report=xml
    
    - name: Kapsam raporunu yükle
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: integrationtests
        name: codecov-integration

  build-package:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    steps:
    - uses: actions/checkout@v3
    - name: Python 3.9 kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Paket oluşturma
      run: |
        pip install build
        python -m build
    
    - name: Artifactları arşivle
      uses: actions/upload-artifact@v3
      with:
        name: dist-artifacts
        path: |
          dist/
          
  mobile-compatibility:
    runs-on: macos-latest
    needs: [unit-tests]
    
    steps:
    - uses: actions/checkout@v3
    - name: Python 3.9 kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'
    
    - name: PyTorch Mobile bağımlılıklarının yüklenmesi
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Mobil uyumluluk testlerinin çalıştırılması
      run: |
        pytest tests/unit -m mobile -v 