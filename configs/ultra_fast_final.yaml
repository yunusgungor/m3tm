# Ultra-Fast Production Validation Config - Context7 Enhanced
model_name_or_path: "microsoft/DialoGPT-small"
max_length: 64

sft_config:
  output_dir: "./ultra_fast_output"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  learning_rate: 1e-3
  warmup_steps: 1
  save_steps: 5
  eval_steps: 5
  logging_steps: 1
  gradient_accumulation_steps: 1
  fp16: false
  bf16: false
  torch_dtype: "float32"
  dataloader_num_workers: 0
  save_total_limit: 1
  load_best_model_at_end: false
  remove_unused_columns: false
  report_to: []
  train_data_path: "./data/ultra_minimal/sft_train_ultra.jsonl"
  eval_data_path: "./data/ultra_minimal/sft_val_ultra.jsonl"
  model_name: "microsoft/DialoGPT-small"
  max_length: 64

grpo_config:
  output_dir: "./ultra_fast_grpo_output"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  learning_rate: 1e-4
  save_steps: 10
  logging_steps: 1
  fp16: false
  torch_dtype: "float32"
  train_data_path: "./data/ultra_minimal/grpo_train_ultra.jsonl"
  eval_data_path: "./data/ultra_minimal/grpo_val_ultra.jsonl"
  max_length: 64

training:
  output_dir: "./ultra_fast_output"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  learning_rate: 1e-3
  warmup_steps: 1
  save_steps: 5
  eval_steps: 5
  logging_steps: 1
  gradient_accumulation_steps: 1
  fp16: false
  bf16: false
  torch_dtype: "float32"
  dataloader_num_workers: 0
  save_total_limit: 1
  load_best_model_at_end: false
  remove_unused_columns: false
  report_to: []
  train_data_path: "./data/ultra_minimal/sft_train_ultra.jsonl"
  eval_data_path: "./data/ultra_minimal/sft_val_ultra.jsonl"
  model_name: "microsoft/DialoGPT-small"
  max_length: 64
