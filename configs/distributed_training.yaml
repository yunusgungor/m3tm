# M³TM Distributed Training Konfigürasyonu
# Multi-GPU ve multi-node eğitimi için optimize edilmiş konfigürasyon

# Model konfigürasyonu
model:
  size: "base"
  use_text_modality: true
  use_image_modality: true
  num_transformer_blocks: 8

# Eğitim konfigürasyonu
training:
  # Distributed training için optimize edilmiş parametreler
  batch_size: 16  # Per-GPU batch size
  learning_rate: 2e-4
  weight_decay: 0.01
  epochs: 100
  
  # Optimizer ve scheduler
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_steps: 2000
  
  # Regularization
  gradient_clip: 1.0
  dropout: 0.1
  
  # Early stopping
  early_stopping_patience: 15
  
  # Cihaz ve performans
  device: "auto"
  mixed_precision: true
  
  # Checkpoint ve logging
  save_every_n_epochs: 5
  eval_every_n_steps: 1000
  log_every_n_steps: 100

# Veri konfigürasyonu
data:
  # Veri dosyaları
  data_dir: "./data"
  train_file: "train.jsonl"
  eval_file: "val.jsonl"
  test_file: "test.jsonl"
  
  # Tokenization
  max_seq_length: 512
  tokenizer_name: "default"
  
  # DataLoader parametreleri (distributed için optimize)
  train_batch_size: 16  # Per-GPU batch size
  eval_batch_size: 32   # Per-GPU batch size
  num_workers: 4        # Per-GPU worker sayısı
  
  # Veri önişleme
  preprocessing:
    normalize_text: true
    image_augmentation: true
    max_image_size: [224, 224]

# Distributed training konfigürasyonu
distributed:
  enabled: true
  backend: "nccl"  # CUDA için nccl, CPU için gloo
  
  # Otomatik algılama (environment variables'dan)
  world_size: 4     # Toplam GPU sayısı
  rank: 0           # Process rank (0, 1, 2, 3)
  local_rank: 0     # Local GPU rank
  
  # Master node bilgileri
  master_addr: "localhost"  # Master node IP
  master_port: "12355"      # Master port
  
  # Multi-node ayarları
  node_rank: 0      # Node rank (multi-node için)
  num_nodes: 1      # Toplam node sayısı
  gpus_per_node: 4  # Node başına GPU sayısı
  
  # Performans optimizasyonları
  find_unused_parameters: false    # Kullanılmayan parametreleri bul
  gradient_as_bucket_view: true    # Gradient bucket optimizasyonu
  static_graph: false              # Statik graph optimizasyonu

# Logging ve monitoring
logging:
  level: "INFO"
  tensorboard: true
  wandb: true
  wandb_project: "m3tm-distributed"
  wandb_name: "distributed-training"
  
  # Metrikler (sadece main process'te)
  track_metrics:
    - "loss"
    - "accuracy"
    - "learning_rate"
    - "gradient_norm"
    - "throughput"

# Çıktı konfigürasyonu
output:
  save_dir: "./outputs/distributed_training"
  model_name: "m3tm_distributed_model"
  save_optimizer_state: true
  
  # Export formatları
  export_formats:
    - "pytorch"
    - "onnx"

# Memory optimization
memory:
  gradient_checkpointing: true
  activation_checkpointing: true
  offload_optimizer: false
  
  # Gradient accumulation (etkili batch size artırma)
  gradient_accumulation_steps: 1

# Profiling ve debugging
profiling:
  enabled: false
  profile_steps: [10, 20, 30]
  export_chrome_trace: true
  
debug:
  profile_memory: false
  detect_anomaly: false
  deterministic: false

# Fault tolerance
fault_tolerance:
  enable_checkpointing: true
  checkpoint_frequency: 1000  # steps
  max_restarts: 3
  
# Communication optimization
communication:
  # Gradient compression
  gradient_compression: false
  compression_ratio: 0.1
  
  # Bucket size for gradient reduction
  bucket_cap_mb: 25
  
  # Overlap computation and communication
  overlap_comm_compute: true
