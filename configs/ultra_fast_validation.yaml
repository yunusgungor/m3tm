"""
Ultra-fast validation configuration with minimal resource usage
"""

# Model: microsoft/DialoGPT-small (minimal model)
model:
  name: "microsoft/DialoGPT-small"
  max_length: 128  # Minimal context
  
training:
  output_dir: "./ultra_fast_validation"
  num_train_epochs: 1  # Single epoch
  per_device_train_batch_size: 1  # Minimal batch
  per_device_eval_batch_size: 1
  learning_rate: 1e-4  # Higher LR for faster convergence
  warmup_steps: 5  # Minimal warmup
  save_steps: 10  # Frequent saves for testing
  eval_steps: 10
  logging_steps: 5
  gradient_accumulation_steps: 1  # No accumulation
  fp16: false  # Disabled due to Half precision issues
  dataloader_num_workers: 0  # No multiprocessing
  save_total_limit: 1  # Single checkpoint
  load_best_model_at_end: false  # Skip evaluation
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  remove_unused_columns: false
  report_to: []  # No external reporting
  
data:
  train_file: "./data/minimal/sft_train_minimal.jsonl"
  eval_file: "./data/minimal/sft_val_minimal.jsonl"
  max_samples: 10  # Ultra-minimal samples

performance:
  max_generation_length: 32  # Very short generation
  batch_size_limit: 1
  memory_threshold: 0.5  # Conservative memory usage
